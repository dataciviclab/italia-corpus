root: "../../out"
schema_version: 1

dataset:
  name: "riferimenti"
  source_id: "italia_corpus"
  description: "Grafo riferimenti del corpus normativa: archi fonte→bersaglio da regex markdown, citazioni AKN, abrogazioni regex e citazioni costituzionali (`rel_type`: `citation`|`abroga`|`cita_costituzione`; `origine`: `regex`|`akn`|`costituzione`). Per i target che non sono atti (articoli della Costituzione) `bersaglio_id` porta l'id del nodo (`costituzione:art:N`) e `bersaglio_urn` non è valorizzata (stringa vuota, come per i link non risolti: usare `NULLIF(bersaglio_urn,'')` per testare l'assenza). PK = fonte_source_path + bersaglio_source_path + origine. Le colonne *_filename restano nel formato engine per legal-graph. `bersaglio_urn` porta l'URN AKN anche quando l'atto è fuori corpus (in quel caso `bersaglio_source_path` = URN e `risolto` = false): la citazione non viene più scartata. `clausola_lettura` marca i rinvii di sola lettura (TRUE), li distingue dalle citazioni (FALSE) e segnala i contesti non classificabili (NULL = archi AKN senza testo)."
  tags: [normativa, grafo, citazioni, riferimenti]
  category: normativa
  years: [2026]
  time_coverage:
    start_year: 1874
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "riferimenti_parquet"
      type: "local_file"
      args:
        path: "../../data/derived/riferimenti.parquet"
        filename: "riferimenti.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - fonte_source_path
    - bersaglio_source_path
    - fonte_source_file
    - bersaglio_source_file
    - fonte_filename
    - fonte_urn
    - bersaglio_filename
    - bersaglio_urn
    - bersaglio_celex
    - bersaglio_id
    - rel_type
    - peso
    - risolto
    - dominio_bersaglio
    - esito
    - origine
    - fonte_stato
    - bersaglio_stato
    - clausola_lettura
  validate:
    # path-aware: basename-only collasserebbe fonti diverse dello stesso file
    primary_key: [fonte_source_path, bersaglio_source_path, origine, rel_type]
    not_null: [fonte_source_path, bersaglio_source_path, peso]
    min_rows: 100000

mart:
  tables:
    - name: "mart_riferimenti_urn"
      sql: "sql/mart_riferimenti_urn.sql"
    - name: "mart_debt_legale"
      sql: "sql/mart_debt_legale.sql"
    - name: "mart_citazioni_per_origine"
      sql: "sql/mart_citazioni_per_origine.sql"
    - name: "mart_top_bersagli"
      sql: "sql/mart_top_bersagli.sql"
    - name: "mart_citazioni_costituzionali"
      sql: "sql/mart_citazioni_costituzionali.sql"
    - name: "mart_frontiera"
      sql: "sql/mart_frontiera.sql"
    - name: "mart_frontiera_epoca"
      sql: "sql/mart_frontiera_epoca.sql"
  required_tables:
    - "mart_riferimenti_urn"
    - "mart_debt_legale"
    - "mart_citazioni_per_origine"
    - "mart_top_bersagli"
    - "mart_citazioni_costituzionali"
    - "mart_frontiera"
    - "mart_frontiera_epoca"
  validate:
    table_rules:
      mart_riferimenti_urn:
        required_columns: [fonte_urn, bersaglio_urn, rel_type, peso, esito, bersaglio_celex]
        primary_key: [fonte_urn, bersaglio_urn, rel_type]
        min_rows: 50000
      mart_debt_legale:
        required_columns: [fonte_stato, bersaglio_stato, n_archi]
        primary_key: [fonte_stato, bersaglio_stato, origine]
        min_rows: 2
      mart_frontiera:
        required_columns: [dominio_bersaglio, esito, n_archi, n_bersagli]
        primary_key: [dominio_bersaglio, esito]
        min_rows: 3
      mart_frontiera_epoca:
        required_columns: [decennio_bersaglio, esito, n_archi]
        primary_key: [decennio_bersaglio, esito]
        min_rows: 20
      mart_citazioni_per_origine:
        required_columns: [origine, n_archi]
        primary_key: [origine]
        min_rows: 2
      mart_citazioni_costituzionali:
        required_columns: [fonte_filename, fonte_anno, fonte_tipo, articolo, peso]
        primary_key: [fonte_filename, articolo]
        min_rows: 5000
      mart_top_bersagli:
        required_columns: [bersaglio_source_path, n_citazioni]
        primary_key: [bersaglio_source_path]
        min_rows: 20

validation:
  fail_on_error: true
