root: "../../out"
schema_version: 1

dataset:
  name: "riferimenti"
  source_id: "italia_corpus"
  description: "Grafo riferimenti del corpus normativa: archi fonte→bersaglio da regex markdown e citazioni AKN. PK = fonte_source_path + bersaglio_source_path + origine. Le colonne *_filename restano nel formato engine per legal-graph."
  tags: [normativa, grafo, citazioni, riferimenti]
  category: normativa
  years: [2026]
  time_coverage:
    start_year: 1874
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "riferimenti_parquet"
      type: "local_file"
      args:
        path: "../../data/derived/riferimenti.parquet"
        filename: "riferimenti.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - fonte_source_path
    - bersaglio_source_path
    - fonte_source_file
    - bersaglio_source_file
    - fonte_filename
    - bersaglio_filename
    - peso
    - risolto
    - origine
  validate:
    # path-aware: basename-only collasserebbe fonti diverse dello stesso file
    primary_key: [fonte_source_path, bersaglio_source_path, origine]
    not_null: [fonte_source_path, bersaglio_source_path, peso]
    min_rows: 100000

mart: {}

validation:
  fail_on_error: true
