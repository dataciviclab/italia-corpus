name: derive-smoke

# Gate pre-merge per le modifiche che possono rompere la pipeline.
# Esegue le stage che sono fallite nei build recenti (grafo + arricchisci)
# sui dati committati, **senza fetch**: ~5-7 min invece dei ~15 del build.
# Il caso che ha motivato il workflow: le abroga contate come citazioni in
# `arricchisci` (invariante Σ n_citazioni), non coperto dai test unitari.
on:
  pull_request:
    paths:
      - "lab_tools/**"
      - "datasets/**"
      - "config/**"

permissions:
  contents: read

concurrency:
  group: derive-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          sparse-checkout: |
            lab_tools/
            tests/
            config/
            datasets/
            data/derived/
            collezioni/
          filter: blob:none
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,pipeline]"
        timeout-minutes: 5
      - name: Derive smoke (grafo + arricchisci, senza fetch)
        run: |
          python -m lab_tools.grafo_riferimenti
          python -m lab_tools.arricchisci_normativa
