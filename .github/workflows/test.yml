name: test-tooling
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          sparse-checkout: |
            lab_tools/
            tests/
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        timeout-minutes: 5
      - run: python -m pytest tests/ -v
