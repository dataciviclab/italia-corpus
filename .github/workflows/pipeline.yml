# Pipeline settimanale — un solo workflow, due job.
#
#   build   → produce i dati (fetch Normattiva, derive) e li committa
#   publish → clean/mart (toolkit) + GCS + registry PR  [needs: build]
#
# Perché due job e non uno: il registry è un workflow riusabile dell'org e
# può essere invocato solo come job. La separazione evita la duplicazione di
# prima (toolkit e sync giravano in due workflow diversi).
#
# Cadenza: lunedì 03:30 UTC. Il probe dei formati è quotidiano e separato
# (probe.yml); i test girano a ogni PR (test.yml).

name: Pipeline (weekly)

on:
  schedule:
    - cron: "30 3 * * 1"  # lunedì 04:30 IT — publish finisce prima di legal-graph (06:00)
  # Contract change (dataset.yml, SQL): basta il job publish, che rifà clean/mart
  # dal raw esistente. Non serve rifare il fetch.
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Salta fetch Normattiva, status e atti API (status/atti_api dalla cache, TTL 30g)"
        type: boolean
        default: false
      force_fetch:
        description: "Riprocessa tutte le collezioni ignorando il manifest (re-parse AKN, locator/contesto)"
        type: boolean
        default: false
      only:
        description: "Solo queste collezioni (nomi esatti separati da virgola; vuoto = tutte)"
        type: string
        default: ""
      backfill_allegati:
        description: "Estrae gli allegati AKN (read-only, legge anche O) e li pubblica su GCS"
        type: boolean
        default: false
      allegati_only:
        description: "Collezioni per il backfill allegati (nomi esatti, virgola; vuoto = tutte)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  build:
    # su merge di datasets/** non serve: il publish rifà clean/mart dal raw
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Solo il build serializza (schedule + dispatch manuale possono sovrapporsi
    # e i due `git push` si pestano). NON a livello di workflow: group unico
    # farebbe cancellare un merge in coda, perdendo la pubblicazione.
    concurrency:
      group: italia-corpus-build
      cancel-in-progress: false
      queue: max  # default 'single' cancellerebbe un dispatch in coda
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          sparse-checkout: |
            lab_tools/
            tests/
            config/
            datasets/
            data/derived/
            collezioni/
          filter: blob:none
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Cache: solo il manifest del fetch (`status`/`atti_api` non servono
      # più qui: i raw arrivano dal layer GCS).
      - name: Generate cache key
        id: cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            data/derived/_fetch_manifest.json
          key: fetch-cache-${{ steps.cache-key.outputs.date }}
          restore-keys: |
            fetch-cache-
      # Input accumulativi del fetch: devono essere ripristinati PRIMA, perché
      # `merge_akn_artifacts`/`aggiorna_indice` fanno merge con la copia
      # precedente. Senza, le collezioni invariate perdono le righe AKN e
      # l'indice allegati riparte da zero a ogni build.
      # `atti_api`: TTL 30g, evita di rifetchare 171 URN.
      - name: Raw derivati per il build
        run: |
          make fetch-raws RAWS="atti_api akn_relations akn_act_meta allegati"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_fetch }}" = "true" ]; then
            make fetch-raws RAWS="status"
          fi
      - name: Lint (ruff)
        run: python -m ruff check lab_tools/ tests/
      - run: python -m pytest tests/ -v
      # Una richiesta: formati disponibili per collezione (O/V/M). Non fatale:
      # se il WAF blocca, resta il probe del run precedente.
      - name: Probe formati collezioni (Normattiva)
        id: probe_collezioni
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        run: python -m lab_tools.collezioni_probe
        continue-on-error: true
      - name: Fetch da Normattiva (MD + artifact AKN)
        id: fetch_normattiva
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        run: |
          # `data/derived/allegati/` è gitignored: per sapere se il fetch ha
          # prodotto qualcosa serve un marker, non `git status`.
          marker=/tmp/fetch_start
          touch "$marker"
          # `--force` (dispatch) ignora il manifest: serve dopo un cambio di
          # parser per rigenerare locator/contesto delle collezioni invariate.
          # `only` limita il fetch a una collezione: riparare un buco di parser
          # su una collezione costa pochi MB invece di un run completo.
          args=()
          if [ "${{ inputs.force_fetch }}" = "true" ]; then args+=(--force); fi
          if [ -n "${{ inputs.only }}" ]; then args+=(--only "${{ inputs.only }}"); fi
          python -m lab_tools.fetch_normattiva "${args[@]}"
          changed=false
          if [ -n "$(git status --porcelain -- collezioni data/derived/allegati.parquet)" ]; then
            changed=true
          elif [ -n "$(find data/derived/allegati -newer "$marker" -print -quit 2>/dev/null)" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "true" ]; then
            echo "corpus/allegati aggiornati"
          else
            echo "nessuna novità di corpus o allegati: niente commit, niente sync"
          fi
      # Backfill allegati (#141): read-only, legge l'espressione disponibile
      # anche `O` e non tocca `collezioni/`. Serve per le collezioni congelate
      # (pin `V`, O esposto) e per gli atti fetchati prima della feature.
      - name: Backfill allegati AKN (#141)
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_allegati
        run: |
          if [ -n "${{ inputs.allegati_only }}" ]; then
            make fetch-allegati ONLY="${{ inputs.allegati_only }}"
          else
            make fetch-allegati
          fi
      # Status: solo classe 3 (lista ufficiale abrogati) ~2 min. La classe 2
      # NON è "vigente", quindi non la scarichiamo; gli atti assenti sono
      # vigenti, salvo la nota whole-act gestita da integra_vigenza.
      - name: Fetch status (ricerca classeProvvedimento)
        id: fetch_status
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        run: python -m lab_tools.fetch_status
        # WAF IPZS: se il fetch è bloccato resta lo status in cache (stale ma
        # presente) e il build prosegue. La guardia strict impedisce comunque
        # di scrivere dati parziali. Prima run senza cache → fallisce (giusto).
        continue-on-error: true
      - name: Warn se status stale (WAF)
        if: steps.fetch_status.outcome == 'failure'
        run: |
          echo "::warning::fetch-status FALLITO (WAF IPZS?) — uso lo status in cache (STALE). La freschezza di 'stato' NON è garantita."
      - name: Extract metadati
        run: python -m lab_tools.extract
      # Gate d'identità sul corpus: main ⊂ build. Deve passare PRIMA di
      # committare `collezioni/`, altrimenti un corpus bucato arriva su main
      # con un manifest che dice "già preso": la run dopo salta il fetch,
      # deriva dal corpus rotto e il gate fallisce di nuovo (loop rosso).
      - name: Gate identità corpus (URN main ⊂ build)
        # Nessun atto può sparire build-over-build (classe 29/10: Codice civile
        # cancellato da uno swap). Logica e test: lab_tools/asserts.py.
        run: python -m lab_tools.asserts urn-subset

      # Il corpus si committa SUBITO DOPO il gate: se un derive fallisce, la
      # run dopo non ripaga il fetch e il manifest (cache) resta coerente con
      # main. Ma un corpus che non passa il gate NON arriva su main.
      - name: Commit corpus (fetch)
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        run: |
          if [ -n "$(git status --porcelain -- collezioni)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add collezioni
            git commit -m "chore(corpus): update collezioni [skip ci]"
            git pull --rebase --autostash
            git push
          fi
      # #142: le forme AKN (codice.civile, regiodecreto, …) non matchano i
      # nodi canonici; si canonicalizzano prima di grafo/publish.
      - name: Canonicalizza URN AKN (#142)
        run: python -m lab_tools.akn_canonicalizza
      # Ordine onesto (docs/PIPELINE.md):
      # classifica prima di grafo; side product PRIMA di integra;
      # integra-vigenza dopo integra (usa abrogato_da) e prima di grafo;
      # integra-akn dopo arricchisci; sunsetting per ultimo.
      - name: Classifica tematico
        run: python -m lab_tools.classifica_tematich
      - name: Citazioni Costituzionali
        run: python -m lab_tools.estrai_citazioni_costituzionali
      - name: Abrogazioni
        run: python -m lab_tools.extract_abrogations
      - name: Integra costituzionali e abrogazioni
        run: python -m lab_tools.integra_costituzionali
      - name: Integra vigenza (stato + vigenza_fonte)
        run: python -m lab_tools.integra_vigenza
      - name: Grafo riferimenti (regex ∪ AKN)
        run: python -m lab_tools.grafo_riferimenti
      - name: Contract check riferimenti (risoluzione)
        # Gate indipendente dal produttore: un churn di filename (fetch che
        # rinomina gli snapshot) fa crollare la risoluzione dei link regex.
        # 2026-10-29: 11 -> 44.079 link non risolti, passato silenzioso.
        run: python -m lab_tools.asserts regex-resolution

      - name: Arricchisci normativa (qualità)
        run: python -m lab_tools.arricchisci_normativa
      - name: Integra metadati AKN (EIV, mod counts)
        run: python -m lab_tools.integra_akn_meta
      - name: Monitor sunsetting
        run: python -m lab_tools.monitor_sunsetting
      - name: Fetch atti API (leggi ordinarie)
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        run: python -m lab_tools.fetch_urn_acts
        # Rate limit: ~2.5s/atto × ~102 atti = ~4 min.
        # Fetch on-demand: python -m lab_tools.fetch_urn_acts --urn "urn:..."
      # Questi due li paga il build (normativa/atti_api freschi) e finiscono
      # sul raw layer: il publish li riusa invece di rifarli a ogni run.
      - name: Fetch direttive UE (Cellar)
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        # continue-on-error non serve: il `|| echo` rende lo step comunque verde
        run: python -m lab_tools.fetch_direttive_ue || echo "::warning::direttive_ue non rigenerato (Cellar?) — resta il raw del layer"
      - name: Atti index (catalogo Normattiva)
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_fetch
        # rm prima: un fallimento deve lasciare il file ASSENTE, così l'upload
        # NON sovrascrive la copia buona sul layer. Il publish usa il raw del
        # layer (l'ultima generazione riuscita).
        run: |
          rm -f data/derived/atti_index.parquet
          make atti-index || echo "::warning::atti_index non generato (WAF?) — resta il raw del layer"
      - name: Contract check (colonne + vigenza, main ⊂ build)
        # Una colonna che sparisce o un downgrade V -> O rompono i consumer
        # (legal_text servirebbe l'originale). Rename dei file = advisory.
        # Logica e test: lab_tools/asserts.py.
        run: python -m lab_tools.asserts contract
      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      # Niente composite gcs-auth: ha ${{ secrets… }} nella description
      # e GitHub fallisce il template validation al load del action.yml.
      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3
      # clean/mart li pubblica il job publish (toolkit + GCS + registry).
      # Qui solo il contenuto degli allegati, che è prodotto dal fetch.
      - name: Sync allegati to GCS
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && (steps.fetch_normattiva.outputs.changed == 'true' || inputs.backfill_allegati)
        run: |
          if [ -d data/derived/allegati ]; then
            gsutil -m rsync -r data/derived/allegati/ "gs://dataciviclab-clean/italia-corpus/allegati/"
          fi
          # indice allegati (#112): senza, i consumer non sanno quali file leggere
          if [ -f data/derived/allegati.parquet ]; then
            gsutil -q cp data/derived/allegati.parquet "gs://dataciviclab-clean/italia-corpus/allegati.parquet"
          fi
      # Raw layer pubblico: i derivati non stanno più in git. Il publish
      # (batch o full) e derive-smoke li scaricano da qui con `make fetch-raws`.
      # `testi` (98 MB) resta generato dal publish; `status`/manifest sono
      # solo del build.
      - name: Sync raw derivati to GCS
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' && github.ref == 'refs/heads/main'
        run: |
          # Non si cancella mai dal layer: è l'unica copia. Un raw assente in
          # questa run (skip_fetch, WAF, Cellar) lascia la copia buona
          # precedente, che il publish continua a usare.
          for f in normativa riferimenti akn_relations akn_act_meta abrogations_raw atti_api direttive_ue atti_index allegati status; do
            if [ -f "data/derived/$f.parquet" ]; then
              gsutil -q cp "data/derived/$f.parquet" "gs://dataciviclab-clean/italia-corpus/_raw/2026/$f.parquet"
              echo "✅ raw $f"
            else
              echo "::warning::raw $f.parquet assente in questa run: resta la copia sul layer"
            fi
          done

  publish:
    needs: build
    # gira anche quando build è saltato (contract change), non quando fallisce
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    # Un merge durante la publish settimanale non deve sovrapporsi a rsync
    # GCS / registry PR: accoda, non cancella.
    concurrency:
      group: italia-corpus-publish
      cancel-in-progress: false
      queue: max
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "italia-corpus"
      # Su merge di datasets/** pubblica solo i dataset toccati (batch.txt);
      # su schedule/dispatch il reusable fa il run completo.
      # Limite noto: una PR che tocca anche codice (lab_tools/**) ripubblica
      # solo i dataset cambiati; gli altri si riallineano alla weekly.
      detect-paths: "datasets"
      run-batch-command: "make run-batch"
      # Cache = solo il manifest. I raw arrivano dal layer, e solo quello
      # del dataset toccato (`run-batch` fa il fetch selettivo).
      cache-paths: |
        data/derived/_fetch_manifest.json
      cache-key: "fetch-cache"
      pre-run-command: "python -m lab_tools.extract --testi-only"
      run-command: "make toolkit-run"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
