name: Pipeline toolkit
# Registry + verify schema: SOLO quando cambia il contratto dataset
# (merge di datasets/**) o su dispatch manuale / weekly.
# Non gira daily: la pipeline completa (build-dataset) è settimanale e pubblica
# già GCS; qui si aggiorna il registry, che ha bisogno dell'artefatto atti_index
# (non committato) — lo rigenera il pre-run, così il job è autosufficiente.
on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: "30 4 * * 1"  # lunedì 06:30 IT — dopo build-dataset (03:30 UTC)
  workflow_dispatch:

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "italia-corpus"
      # atti_index è gitignored: su checkout pulito va rigenerato, altrimenti
      # `make toolkit-run` salta il dataset (guardia) e il registry non si aggiorna.
      pre-run-command: "make atti-index || echo '::warning::atti_index non generato (WAF?) — dataset saltato'"
      run-command: "make toolkit-run"
      detect-paths: "datasets"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
