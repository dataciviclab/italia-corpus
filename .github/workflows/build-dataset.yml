name: build-dataset
# Daily: engine Normattiva + layer toolkit → GCS clean/mart.
# NESSUN registry build qui (evita draft PR giornaliere: signals/updated_at
# cambiano a ogni run). Il registry viene aggiornato da pipeline.yml
# solo su merge di datasets/** o dispatch/schema change.
on:
  schedule:
    - cron: '30 5 * * *'  # 06:30 IT
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          sparse-checkout: |
            lab_tools/
            tests/
            config/
            datasets/
            data/derived/
            collezioni/
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev,pipeline]"
      - name: Lint (ruff)
        run: python -m ruff check lab_tools/ tests/
      - run: python -m pytest tests/ -v
      - name: Fetch da Normattiva (MD + artifact AKN)
        run: python -m lab_tools.fetch_normattiva
      - name: Extract metadati
        run: python -m lab_tools.extract
      # Ordine onesto (docs/PIPELINE.md):
      # classifica prima di grafo; side product PRIMA di integra;
      # integra-akn dopo arricchisci; sunsetting per ultimo.
      - name: Classifica tematico
        run: python -m lab_tools.classifica_tematich
      - name: Citazioni Costituzionali
        run: python -m lab_tools.estrai_citazioni_costituzionali
      - name: Riferimenti PNRR
        run: python -m lab_tools.extract_pnrr_refs
      - name: Abrogazioni
        run: python -m lab_tools.extract_abrogations
      - name: Integra costituzionali e abrogazioni
        run: python -m lab_tools.integra_costituzionali
      - name: Grafo riferimenti (regex ∪ AKN)
        run: python -m lab_tools.grafo_riferimenti
      - name: Arricchisci normativa (qualità)
        run: python -m lab_tools.arricchisci_normativa
      - name: Integra metadati AKN (EIV, mod counts)
        run: python -m lab_tools.integra_akn_meta
      - name: Monitor sunsetting
        run: python -m lab_tools.monitor_sunsetting
      - name: Contract check (colonne main ⊂ build)
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import pyarrow.parquet as pq
          main = Path("/tmp/main_normativa.parquet")
          main.write_bytes(subprocess.check_output(
              ["git", "show", "HEAD:data/derived/normativa.parquet"]
          ))
          if not main.exists() or main.stat().st_size < 1000:
              print("skip contract check (snapshot non disponibile)")
              raise SystemExit(0)
          main_cols = set(pq.read_schema(main).names)
          br_cols = set(pq.read_schema("data/derived/normativa.parquet").names)
          missing = sorted(main_cols - br_cols)
          if missing:
              raise SystemExit(f"COLONNE MAIN MANCANTI: {missing}")
          print(f"contract ok: main={len(main_cols)} build={len(br_cols)}")
          PY
      - name: Layer toolkit (clean + mart)
        run: make toolkit-run
      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      # Niente composite gcs-auth: ha ${{ secrets… }} nella description
      # e GitHub fallisce il template validation al load del action.yml.
      - name: Set up gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3
      - name: Sync clean/mart to GCS
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          gsutil -m rsync -r out/data/clean/ "gs://dataciviclab-clean/italia-corpus/"
          gsutil -m rsync -r out/data/mart/  "gs://dataciviclab-mart/italia-corpus/"
          echo "✅ GCS: dataciviclab-clean|mart/italia-corpus/"
      - name: Commit derived if changed
        run: |
          if [ -n "$(git status --porcelain -- data/derived collezioni)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add data/derived collezioni
            git commit -m "chore(data): update dataset [skip ci]"
            git push
          fi
