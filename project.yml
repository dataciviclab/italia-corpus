# DataCivicLab — Italia Corpus
name: italia-corpus
kind: corpus-project
status: public-exploration
description: >
  Corpus della legislazione italiana vigente, scaricato direttamente
  dall'API Normattiva OpenData. Tooling Lab per estrazione metadati,
  grafo riferimenti normativi, e ricerca full-text via MCP.
data_source:
  type: normattiva_api
  endpoint: https://api.normattiva.it/t/normattiva.api/bff-opendata/v1/api/v1
  format: akn_xml
  filter: formatoRichiesta=V (solo atti vigenti)
datasets:
  - normativa  # dataset principale, generato da lab_tools.extract
datasets_deprecated:
  - normativa_recepimento_ue  # subset storico, non più aggiornabile (nessun CELEX upstream)
maintainer: DataCivicLab
