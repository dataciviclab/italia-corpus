[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "italia-corpus-lab"
version = "0.1.0"
description = "DataCivicLab tooling per Italia Corpus"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "lab-connectors[mcp] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pandas>=2",
    "pyarrow>=15",
]

[project.scripts]
italia-corpus-mcp = "lab_tools.mcp_server:main"
italia-corpus-extract = "lab_tools.extract:main"

[tool.pytest.ini_options]
markers = [
    "contract: Contratto pubblico (CLI/API/output)",
    "pure_unit: Logica pura isolata",
    "policy: Regola non ovvia",
    "smoke: Flusso end-to-end",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["lab_tools", "tests"]

[tool.ruff.lint]
# Allineato al gate CI: ruff check lab_tools/ tests/
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
include = ["lab_tools*"]
